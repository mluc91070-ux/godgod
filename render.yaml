# Render blueprint: API, research worker and PostgreSQL in one file.
#
#   render.com → New → Blueprint → point at this repository
#
# The frontend is deployed separately on Vercel (see docs/DEPLOYMENT.md); it is
# a static-rendered Next app that only needs NEXT_PUBLIC_API_URL.
#
# Secrets are marked sync:false — they are typed into the dashboard, never
# committed here. ADMIN_TOKEN is generated by Render so no human ever chooses it.

databases:
  - name: godgod-db
    databaseName: godgod
    user: godgod
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: godgod-api
    runtime: docker
    # Starter, not free: a free instance sleeps after ~15 minutes idle and takes
    # 30-60s to wake. Pages fetch server-side, so that showed up as a site that
    # would not load. The keepalive ping was a mitigation; this is the fix.
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # No dockerCommand: the image's own entrypoint (backend/start.sh) migrates
    # then serves. Render splits a start command into argv without a shell, so
    # `a && b` there arrives as arguments to `a`.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: godgod-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: AUTONOMY_LEVEL
        value: "1"
      - key: X_MODE
        value: draft
      - key: EXTERNAL_CONTENT_IS_UNTRUSTED
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FIXTURES_DIR
        value: /data/fixtures
      - key: WATCHLIST_NOTES_PATH
        value: /data/watchlist/robinhood-runners.json
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL_WRITER
        sync: false
      - key: MODEL_CRITIC
        sync: false
      - key: MODEL_PRICE_INPUT_USD_PER_MTOK
        sync: false
      - key: MODEL_PRICE_OUTPUT_USD_PER_MTOK
        sync: false
      - key: LLM_DAILY_BUDGET_USD
        value: "3.0"
      # The second chain. Read-only: the client has four methods and none of
      # them can sign or send. Both are set in the dashboard rather than here —
      # the factory addresses in particular should be verified against the
      # chain before they are trusted, see .env.example.
      - key: EVM_RPC_URL
        sync: false
      - key: EVM_CHAIN_ID
        sync: false
      - key: EVM_LAUNCHPAD_FACTORIES
        sync: false
      # Public chain data, not a secret, so it lives here where it can be
      # reviewed in a diff. Addresses only: nothing a list says *about* a token
      # is stored, and these rows are dropped from every dataset by name.
      - key: CHAIN_WATCHLIST
        value: "robinhood:0x39dBED3a2bd333467115dE45665cC57F813C4571,robinhood:0x020bfC650A365f8BB26819deAAbF3E21291018b4,robinhood:0x2E8c31162b855A2ffa90F6F8634643Ad6F111e18,robinhood:0x98096d17e191B3dA1d5f99a6D7b3584351b11E18,robinhood:0x5Cb6F181081301b44905F3ae15419112ecaBd8A6,robinhood:0x7FE995a80075dF3Dc8Ae11A9b82c7FE4202CD87f,robinhood:0xe934e36a439c94017b64a3fece66af12099abf50,robinhood:0x45242320dbb855eea8fd36804c6487e10e97fcf9,robinhood:0xd5f1afea47b1a9eab414d2ee740cf1d6d039e725,robinhood:0x18e674231a58c239dc7daedcffe15ec3a24cff5c,robinhood:0x5173d45a1191ee33cbb7d8c7e65f21b04ed54802,robinhood:0xD7321801CAae694090694Ff55A9323139F043B88,robinhood:0x8e62F281f282686fCa6dCB39288069a93fC23F1c,robinhood:0xded852De9fe9bA9b6f27f39e8e81CF851A5C79cc"

# The research cycle used to be a Render cron service here. Render crons are
# paid-only, and the job is one authenticated POST, so it lives in
# .github/workflows/research.yml instead — free, scheduled hourly, and it wakes
# the free instance as a side effect. Set GODGOD_API_URL and GODGOD_ADMIN_TOKEN
# as repository secrets to switch it on.
