# Render blueprint: API, research worker and PostgreSQL in one file.
#
#   render.com → New → Blueprint → point at this repository
#
# The frontend is deployed separately on Vercel (see docs/DEPLOYMENT.md); it is
# a static-rendered Next app that only needs NEXT_PUBLIC_API_URL.
#
# Secrets are marked sync:false — they are typed into the dashboard, never
# committed here. ADMIN_TOKEN is generated by Render so no human ever chooses it.

databases:
  - name: godgod-db
    databaseName: godgod
    user: godgod
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: godgod-api
    runtime: docker
    # Free to launch. A free instance spins down when idle and takes ~30s to
    # wake; the hourly GitHub Actions workflow wakes it as a side effect of
    # running the research cycle. Move to `starter` when that stops being funny.
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Migrations run before the first request, never on import.
    # No `sh -c` wrapper: Render already runs this through a shell, and wrapping
    # it again turns the whole line into one command name (exit 127).
    dockerCommand: alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: godgod-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: AUTONOMY_LEVEL
        value: "1"
      - key: X_MODE
        value: draft
      - key: EXTERNAL_CONTENT_IS_UNTRUSTED
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FIXTURES_DIR
        value: /data/fixtures
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL_WRITER
        sync: false
      - key: MODEL_CRITIC
        sync: false
      - key: MODEL_PRICE_INPUT_USD_PER_MTOK
        sync: false
      - key: MODEL_PRICE_OUTPUT_USD_PER_MTOK
        sync: false
      - key: LLM_DAILY_BUDGET_USD
        value: "3.0"

# The research cycle used to be a Render cron service here. Render crons are
# paid-only, and the job is one authenticated POST, so it lives in
# .github/workflows/research.yml instead — free, scheduled hourly, and it wakes
# the free instance as a side effect. Set GODGOD_API_URL and GODGOD_ADMIN_TOKEN
# as repository secrets to switch it on.
