[project]
name = "godgod"
version = "0.1.0"
description = "GODGOD — autonomous meme intelligence and research agent"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Enum members named PASS / TOKEN are research vocabulary, not credentials.
"backend/app/core/enums.py" = ["S105"]
"tests/*" = ["S105", "S106"]
"backend/alembic/versions/*" = ["E501", "I001"]
