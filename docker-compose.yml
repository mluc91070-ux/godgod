services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: godgod
      POSTGRES_PASSWORD: godgod
      POSTGRES_DB: godgod
    ports:
      - "5432:5432"
    volumes:
      - godgod-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godgod -d godgod"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://godgod:godgod@db:5432/godgod
      DEMO_MODE: "true"
      AUTONOMY_LEVEL: "1"
      X_MODE: draft
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    command: >
      sh -c "alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  godgod-db:
